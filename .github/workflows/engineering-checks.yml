name: Engineering Checks

on:
  workflow_dispatch:
    inputs:
      run_android_build:
        description: "Also build the standalone Android APK"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # v4
        with:
          version: 9.12.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test

  android:
    name: Optional Android build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_android_build == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # v4
        with:
          version: 9.12.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4 # v4.4.2
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK bundle
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fxq "assets/index.android.bundle"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4 # v4
        with:
          name: engineering-checks-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
