name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build standalone Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project from Expo config
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4 # v4.4.2

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify standalone APK and bundled JavaScript
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fxq "assets/index.android.bundle"

      - name: Upload self-contained Android test APK
        uses: actions/upload-artifact@v4 # v4
        with:
          name: raabta-ai-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
